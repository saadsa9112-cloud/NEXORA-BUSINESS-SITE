<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | NEXORA DIGITAL</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F7F9FC;
        color: #0B1020;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid #E5EAF1;
        border-radius: 20px;
        padding: 48px 32px;
        max-width: 540px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 9999px;
        background: #EFF6FF;
        color: #0066FF;
        border: 1px solid rgba(0, 102, 255, 0.2);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 64px;
        font-weight: 900;
        color: #0066FF;
        line-height: 1;
        margin-bottom: 12px;
      }
      h2 {
        font-size: 22px;
        font-weight: 800;
        color: #0B1020;
        margin-bottom: 12px;
      }
      p {
        font-size: 14px;
        color: #4B5563;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        background: #0066FF;
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        border-radius: 12px;
        text-decoration: none;
        transition: background 0.2s;
      }
      .btn-primary:hover { background: #0052CC; }
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        padding: 12px 20px;
        background: #F8FAFC;
        border: 1px solid #E5EAF1;
        color: #0B1020;
        font-weight: 600;
        font-size: 14px;
        border-radius: 12px;
        text-decoration: none;
        transition: background 0.2s;
      }
      .btn-secondary:hover { background: #F1F5F9; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">NEXORA DIGITAL • BUILDING DIGITAL SUCCESS</div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
      <div class="links">
        <a href="/" class="btn-primary">Return Home &rarr;</a>
        <a href="/#services" class="btn-secondary">Services</a>
        <a href="/#work" class="btn-secondary">Our Work</a>
        <a href="/#contact" class="btn-secondary">Contact</a>
      </div>
    </div>
  </body>
</html>
